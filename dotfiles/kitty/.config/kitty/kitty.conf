# kitty — eDEX "tron" look: Fira Mono, cyan on near-black, see-through.
font_family      Fira Mono
font_size        11.0
disable_ligatures always

foreground            #aacfd1
background            #05080d
background_opacity    0.82
selection_foreground  #05080d
selection_background  #aacfd1
cursor                #aacfd1
cursor_text_color     #05080d
cursor_shape          block
cursor_blink_interval 0.6
url_color             #d4f2f4

window_padding_width  14
confirm_os_window_close 0
enable_audio_bell no
visual_bell_duration 0.08
visual_bell_color #262828

# Header strip like eDEX's "TERMINAL // MAIN SHELL" tabs.
tab_bar_edge          top
tab_bar_min_tabs      1
tab_bar_style         separator
tab_separator         "  │  "
tab_title_template    "{index}  {title}"
tab_bar_margin_height 6 6
active_tab_foreground   #05080d
active_tab_background   #aacfd1
inactive_tab_foreground #4f6566
inactive_tab_background #05080d
tab_bar_background      #05080d

# 16-colour palette, cooled down to sit inside the cyan scheme.
color0  #05080d
color8  #4f6566
color1  #d15b5b
color9  #ff7a7a
color2  #6fc3a0
color10 #8fe3c0
color3  #d1c27a
color11 #f0e19a
color4  #5f9fb5
color12 #7fc4dd
color5  #9a8fd1
color13 #b9afff
color6  #aacfd1
color14 #d4f2f4
color7  #aacfd1
color15 #e8f6f7

map ctrl+shift+t new_tab_with_cwd
map ctrl+shift+enter new_window_with_cwd
