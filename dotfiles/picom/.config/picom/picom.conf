# picom — compositor. Gives the HUD its translucent, glowing panels.
backend = "glx";
vsync = true;
use-damage = true;

# Sharp HUD corners.
corner-radius = 0;

# Soft cyan "glow" instead of a black drop shadow.
shadow = true;
shadow-radius = 18;
shadow-opacity = 0.35;
shadow-offset-x = -18;
shadow-offset-y = -18;
shadow-color = "#aacfd1";
shadow-exclude = [
  "class_g = 'Rofi'",
  "window_type = 'desktop'",
  "_NET_WM_STATE@[*]:a = '_NET_WM_STATE_FULLSCREEN'"
];

fading = true;
fade-in-step = 0.06;
fade-out-step = 0.06;
fade-delta = 8;

# Frosted glass behind translucent windows (kitty, eww panels).
blur-method = "dual_kawase";
blur-strength = 5;
blur-background-exclude = [
  "window_type = 'desktop'",
  "class_g = 'HudGlobe'"
];

inactive-opacity = 1.0;
frame-opacity = 1.0;
detect-client-opacity = true;
mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-rounded-corners = false;
detect-transient = true;

wintypes:
{
  tooltip = { fade = true; shadow = false; opacity = 0.95; };
  dock = { shadow = false; };
  dnd = { shadow = false; };
  popup_menu = { opacity = 0.95; };
  dropdown_menu = { opacity = 0.95; };
};
